syntax = "proto3";

package user;

option go_package = "./userpb";

message RegisterReq {
  string phone = 1;
  string password = 2;
  string captcha = 3;
}
message RegisterResp{
  string userId=1;
}

message LoginReq {
  string phone = 1;
  string password = 2;
}
message LoginResp{
  string userId=1;
}

message CaptchaReq{
  string phone = 1;
}
message CaptchaResp{
  string captcha=1;
}
message UserInfoReq{
  string userId=1;
}
message UserInfoResp{
  string username=1;
  string userId=2;
  string avatar=3;
  string phone=4;
  uint64 age=5;
  uint64 sex=6;
  int64  region=7;
  string balance=8;
}
message ChangeInfoReq{
  string userId=1;
  optional string username=2;
  optional string avatar=3;
  optional int64 region=4;
  optional uint64 age=5;
  optional uint64 sex=6;
}
message ChangeInfoResp{
  bool ok=1;
}
message GetRegionReq{
  optional int64 level=1;
  optional int64 pid=2;
}
message RegionItem{
  int64 id=1;
  int64 pId=2;
  string name=3;
  int64 level=4;
}
message GetRegionResp{
  repeated RegionItem list=1;
}
message GetSellPowerReq{
  string userId=1;
}
message GetSellPowerResp{
  bool ok=1;
}
message AddReceiveAddressReq{
  string receiveName=1;
  string receivePhone=2;
  int64 addressId=3;
  string detail=4;
  string userId=5;
  int64 isDefault=6;
}
message AddReceiveAddressResp{
  bool ok=1;
}
message GetReceiveAddressReq{
  string userId=1;
}
message GetReceiveAddressResp {
  repeated AddressItem list=1;
}
message AddressItem{
  string receive_name = 1;
  string receive_phone = 2;
  string address_merge_name = 3;
  int64 is_default = 4;
  string detail = 5;
}
message GetDefaultAreaReq{
  string userId=1;
}
message GetDefaultAreaResp{
  string receiver_name =1;
  string receiver_phone =2;
  string receiver_address =3;
}
service User {
  rpc Register (RegisterReq) returns (RegisterResp);
  rpc Login (LoginReq) returns (LoginResp);
  rpc Captcha (CaptchaReq) returns (CaptchaResp);
  rpc UserInfo (UserInfoReq) returns (UserInfoResp);
  rpc ChangeInfo (ChangeInfoReq) returns (ChangeInfoResp);
  rpc GetRegion (GetRegionReq) returns (GetRegionResp);
  rpc GetSellPower (GetSellPowerReq) returns (GetSellPowerResp);
  rpc AddRecAddress (AddReceiveAddressReq) returns (AddReceiveAddressResp);
  rpc GetReceiveAddress (GetReceiveAddressReq) returns (GetReceiveAddressResp);
  rpc GetDefaultArea (GetDefaultAreaReq) returns (GetDefaultAreaResp);
}