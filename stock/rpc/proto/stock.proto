syntax = "proto3";

package stock;

option go_package = "./stockPb";

message insertStockReq{
  int64 stock=1;
  string goodsId=2;
}
message insertStockResp{
  bool ok=1;
}
message getStockReq{
  string goodsId=1;
}
message getStockResp{
  int64 stock=1;
}
service stock{
  rpc insertStock (insertStockReq) returns (insertStockResp);
  rpc getStock   (getStockReq) returns (getStockResp);
}