syntax = "proto3";

package stock;

option go_package = "./stockPb";

message getStockReq{
  string goodsId=1;
}
message getStockResp{
  int64 stock=1;
}
message preHeatStockReq{
  repeated string goodsId=1;
}
message preHeatStockResp{
  bool ok=1;
}
service stock{
  rpc getStock   (getStockReq) returns (getStockResp);
  rpc preHeatStock (preHeatStockReq) returns (preHeatStockResp);
}